[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "local-call-transcriber"
version = "0.3.0"
description = "Fail-closed local CLI for offline Russian call transcription"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary project wrapper; see third-party notices before distribution"}
dependencies = ["miniaudio==1.61"]

[project.optional-dependencies]
aac = ["av==18.0.0; python_version >= '3.11'"]
test = [
    "av==18.0.0; python_version >= '3.11'",
    "numpy==1.26.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
